name: CI

# Full gate for pi-mega-compact — mirrors scripts/deploy.sh.
#   npm run build  (tsc)
#   npm test       (build + isolated per-file node --test runner)
#   npm run lint   (tsc --noEmit + guardrails-scan + semantic-scan)
#   regression_check (Four-Laws / scope / secrets audit)
#   schema-health-check (S49B gate)
# Runs on every push and PR to master so the repo can never go red silently.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  gate:
    name: Build + Test + Lint + Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Test (isolated per-file node --test)
        run: npm test

      - name: Lint (tsc --noEmit + guardrails-scan + semantic-scan)
        run: npm run lint

      - name: Regression audit (Four-Laws / scope / secrets)
        run: python3 scripts/regression_check.py --all

      - name: Schema health check (S49B)
        run: node scripts/schema-health-check.mjs
